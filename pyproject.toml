[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная база данных с хранением таблиц в JSON"
authors = [{name = "Vadim Patsev", email = "363312+basvasilich@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable==3.18.0",
    "prompt==0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
